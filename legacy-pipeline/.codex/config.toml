# Project defaults; explicit session/model selections still take precedence.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
# Unclassified work must not silently fall back to the lightweight profile.
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"
