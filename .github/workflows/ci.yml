name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Tests (tools and guard)
        run: python -m pytest -q tools/tests
      - name: Leak scan
        run: python tools/check_leaks.py
      - name: Index is up to date
        shell: bash
        run: |
          python tools/build_index.py
          git diff --exit-code INDEX.json
